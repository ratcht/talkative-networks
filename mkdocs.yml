site_name: chatty-networks
docs_dir: docs

nav:
  - Home: index.md
  - Testbed (v3):
      - Channel: testbed/channel.md
      - Soft-gated MoE: testbed/moe.md
      - Metrics: testbed/metrics.md
      - Docket: docket.md
  - Studies:
      - Channel ladder: studies/channel-ladder.md

markdown_extensions:
  # generic mode hands math to MathJax rather than rendering it server-side, and
  # shields the formulas from Markdown's own treatment of _ and * on the way
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
